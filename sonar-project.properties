sonar.projectKey=jaderss_prime-bench
sonar.organization=jaderss
sonar.projectName=prime-bench

sonar.sources=.
sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,results/**,docs/**,**/*_test.go,apps/java/src/test/**,apps/java/mvnw*,apps/java/.mvn/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go,apps/java/src/test/**

sonar.java.source=25
sonar.java.binaries=apps/java/target/classes
sonar.java.test.binaries=apps/java/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=apps/java/target/site/jacoco/jacoco.xml
sonar.go.coverage.reportPaths=apps/go/coverage.out,mock/coverage.out,loadgen/coverage.out
sonar.rust.clippyReport.reportPaths=apps/rust/clippy-report.json
