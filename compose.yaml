name: prime-bench

x-app: &app
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  cpus: ${APP_CPUS:-2}
  mem_limit: ${APP_MEMORY_MB:-1536}m
  volumes:
    - ./results:/results
  environment:
    MODE: server
    BITS: ${SERVER_BITS:-512}
    COUNT: ${BATCH_COUNT:-200}
    ROUNDS: ${ROUNDS:-20}
    RUN_ID: ${RUN_ID:-local}
    DOWNSTREAM_URL: http://mock:8080
    JAVA_OPTS: -XX:+Use${JVM_GC:-ParallelGC} -XX:MaxRAMPercentage=${HEAP_PERCENT:-75} ${JAVA_OPTS:-}
    GOGC: ${GOGC:-}
    GODEBUG: ${GODEBUG:-}

services:
  java:
    <<: *app
    build:
      context: apps/java
      args:
        JAVA_VERSION: ${JAVA_VERSION:-27}
    image: prime-bench/java:${JAVA_VERSION:-27}
    ports: ["8081:8080"]

  go:
    <<: *app
    build:
      context: apps/go
      args:
        GO_VERSION: ${GO_VERSION:-1.27}
    image: prime-bench/go:${GO_VERSION:-1.27}
    ports: ["8082:8080"]

  rust:
    <<: *app
    build:
      context: apps/rust
      args:
        RUST_VERSION: ${RUST_VERSION:-1.99}
    image: prime-bench/rust:${RUST_VERSION:-1.99}
    ports: ["8083:8080"]

  spring:
    <<: *app
    build:
      context: apps/spring
      target: jvm
      args:
        SPRING_JAVA_VERSION: ${SPRING_JAVA_VERSION:-25}
    image: prime-bench/spring:java${SPRING_JAVA_VERSION:-25}
    ports: ["8084:8080"]

  spring-native:
    <<: *app
    build:
      context: apps/spring
      target: native
      args:
        SPRING_JAVA_VERSION: ${SPRING_JAVA_VERSION:-25}
    image: prime-bench/spring-native:java${SPRING_JAVA_VERSION:-25}
    command: ["-XX:MaximumHeapSizePercent=${HEAP_PERCENT:-75}"]
    ports: ["8085:8080"]

  loadgen:
    profiles: [tools]
    build:
      context: .
      dockerfile: loadgen/Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.27}
    image: prime-bench/loadgen:go${GO_VERSION:-1.27}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    cpus: ${LOADGEN_CPUS:-2}
    volumes:
      - ./results:/results
    environment:
      TARGET: ${TARGET:-http://go:8080}
      USERS: ${USERS:-1000}
      DURATION: ${DURATION:-60s}
      RAMP_UP: ${RAMP_UP:-15s}
      THINK_TIME: ${THINK_TIME:-2s}
      BITS: ${SERVER_BITS:-512}
      RUN_ID: ${RUN_ID:-local}

  mock:
    profiles: [tools]
    build:
      context: .
      dockerfile: mock/Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.27}
    image: prime-bench/mock:go${GO_VERSION:-1.27}
    cpus: ${MOCK_CPUS:-1}
    environment:
      MOCK_LATENCY: ${MOCK_LATENCY:-30ms}
      MOCK_JITTER: ${MOCK_JITTER:-10ms}
      MOCK_TRANSACTIONS: ${MOCK_TRANSACTIONS:-40}
      MOCK_ERROR_RATE: ${MOCK_ERROR_RATE:-0}

  dashboard:
    build:
      context: dashboard
      args:
        NODE_VERSION: ${NODE_VERSION:-26}
        NGINX_VERSION: ${NGINX_VERSION:-1.31}
    image: prime-bench/dashboard
    ports: ["${DASHBOARD_PORT:-8080}:80"]
    volumes:
      - ./results:/usr/share/nginx/html/results:ro
