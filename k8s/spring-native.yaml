apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-native
spec:
  replicas: 0
  selector:
    matchLabels: {app: spring-native}
  template:
    metadata:
      labels: {app: spring-native}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532}
      containers:
        - name: spring-native
          image: prime-bench/spring-native:java${SPRING_JAVA_VERSION}
          imagePullPolicy: Never
          args: ["-XX:MaximumHeapSizePercent=${HEAP_PERCENT}"]
          env:
            - {name: MODE, value: server}
            - {name: BITS, value: "${SERVER_BITS}"}
            - {name: ROUNDS, value: "${ROUNDS}"}
            - {name: DOWNSTREAM_URL, value: "http://mock:8080"}
            - {name: RESULTS_DIR, value: /tmp}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: "${APP_CPUS}", memory: "${APP_MEMORY_MB}Mi", ephemeral-storage: 64Mi}
            limits: {cpu: "${APP_CPUS}", memory: "${APP_MEMORY_MB}Mi", ephemeral-storage: 256Mi}
          securityContext: {allowPrivilegeEscalation: false}
---
apiVersion: v1
kind: Service
metadata:
  name: spring-native
spec:
  selector: {app: spring-native}
  ports: [{port: 8080}]
